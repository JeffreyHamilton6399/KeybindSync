name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build 1.20–1.20.1
        run: |
          cd mc1_20_1
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Build 1.20.2–1.20.6
        run: |
          cd mc1_20_4
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Build 1.21–1.21.8
        run: |
          cd mc1_21
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Build 1.21.9–1.21.11
        run: |
          cd fabric-1.21
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARs
          path: |
            mc1_20_1/build/libs/keybindsync-*.jar
            mc1_20_4/build/libs/keybindsync-*.jar
            mc1_21/build/libs/keybindsync-*.jar
            fabric-1.21/build/libs/keybindsync-*.jar
          if-no-files-found: error
